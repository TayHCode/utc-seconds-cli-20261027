name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, "${{ vars.FLEET_WINDOWS_RUNNER }}"]
    steps:
      - uses: actions/checkout@v4
      - name: Run CLI tests
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .fleet/verify.ps1
